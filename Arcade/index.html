['난이도별 집중력',`<table><tr><th>난이도</th><th>자동 / 초</th><th>명중</th><th>근접 회피</th></tr><tr><td>재학생</td><td>4%</td><td>0.1%</td><td>12%</td></tr><tr><td>시험 일주일 전</td><td>3.5%</td><td>0.0875%</td><td>10.5%</td></tr><tr><td>시험 전날</td><td>3%</td><td>0.075%</td><td>9%</td></tr><tr><td>시험 당일</td><td>2.5%</td><td>0.0625%</td><td>7.5%</td></tr></table><p>기본 답안 기준입니다. 보조 답안의 명중 충전은 기본의 20%입니다. 난이도가 높을수록 탄막이 빠르고 잦아지고, 생존 여유가 줄어듭니다.</p>`],
['시험 당일',`<p>재학생 대비 탄속·공격 빈도 1.42배, 교수 체력 1.24배.<br>시작 멘탈 5 · 회피 대기 2.8초 · 피격 후 무적 1.2초.<br>위험 구역 예고 1.05초 · 보급품 간격 16초.</p><p>0.3초 이상 제자리에 있으면 근접 회피 충전량이 20%로 줄어듭니다(7.5% → 1.5%). 실제 이동 속도가 초당 20px를 넘으면 정상 충전으로 돌아옵니다.</p><p>벽을 향해 키만 누르거나 아주 조금 움직여도 정지로 취급합니다. 근접 회피 점수와 답안 명중 충전량은 유지됩니다.</p>`],
['광복관 매점',`<p>1~5교시를 마치면 멘탈 1·E 1을 무료 보충하고 매점이 열립니다. 교시 통과 보상은 1,200점입니다.</p><p><b>구매 가격만큼 현재 점수가 차감되며 최종 기록에도 반영됩니다.</b> 별도 재화는 없습니다. 구매하지 않고 바로 다음 수업에 들어갈 수도 있습니다.</p><p>커피·에너지드링크·예비 답안은 상점당 1개. 나머지는 아이템에 표시된 한도까지 구매할 수 있습니다. 기본서·속기 노트·판례집은 구매마다 200점씩 비싸집니다.</p>`],

function help(page=0){state='help';helpPage=page;const sheet=helpSheets[page];show(`<div class="help-page"><div class="eyebrow">도움말</div><h2>${sheet[0]}</h2>${sheet[1]}${pager(page,helpSheets.length,'help')}<button class="back" id="back">처음으로</button></div>`);bindPager(page,helpSheets.length,n=>help(n));document.querySelector('#back').onclick=menu;}


function startRun(){courseGrades=Array(bosses.length).fill(null);frontPage(false);shopBought={};focus=40;grazeCount=0;chain=0;peakChain=0;damageTaken=0;attempts=0;build=[];baseStart();};
next=function(){stageHitsStart=damageTaken;stillTime=0;insight=0;attackCount=0;dropCount=0;baseNext();beams=[];phaseSeen=false;extraClock=3.5;chain=0;chainTime=0;p.cd=0;p.dash=0;checkpoint={courseGrades:[...courseGrades],p:{...p},score,elapsed,focus,grazeCount,damageTaken,peakChain};};
dodge=function(){if(state==='play'&&p.cd<=0){baseDodge();if(p.dashReduction)p.cd*=.65;if(!keys.KeyW&&!keys.KeyA&&!keys.KeyS&&!keys.KeyD&&!keys.ArrowUp&&!keys.ArrowDown&&!keys.ArrowLeft&&!keys.ArrowRight&&!pointer){p.y=Math.min(H-24,p.y+35)}}};
hit=function(){if(p.inv>0)return;if(p.shield){p.shield=false;p.inv=1.5;burst(p.x,p.y,'#aad9fa',24);quote='예비 답안이 감점을 막았습니다.';quoteT=2;return}damageTaken++;chain=0;focus=Math.max(0,focus-5);baseHit();};
attack=function(){attackCount++;let stage=attackStage();if(stage===5){const b=bosses[level],a=Math.atan2(p.y-boss.y,p.x-boss.x);for(let i=-2;i<=2;i++)bullet(boss.x,boss.y+25,a+i*.29,155*mode,b.words[(i+3)%3],b.color);if(attackCount%2===0)for(let i=0;i<7;i++)bullet(boss.x,boss.y,Math.PI*(i+.5)/7,110*mode,'등기',b.color);tone(180,.04);return}if(stage<3){baseAttack();return}let b=bosses[level],a=Math.atan2(p.y-boss.y,p.x-boss.x),v=(125+stage*8)*mode;if(stage===3){for(let i=-2;i<=2;i++)bullet(boss.x,boss.y+25,a+i*.28,v,b.words[(i+3)%3],b.color);if(attackCount%3===0)for(let i=0;i<4;i++){let fromLeft=attackCount%6===0;bullet(fromLeft?18:W-18,265+i*95,fromLeft?0:Math.PI,70*mode,fromLeft?'항변':'반소',b.color)}}else{for(let i=0;i<10;i++)bullet(boss.x,boss.y,Math.PI*2*i/10+t*.4,115*mode,b.words[i%3],b.color);for(let i=-1;i<=1;i++)bullet(boss.x,boss.y,a+i*.24,v,'쟁점',b.color)}tone(160,.04);};
function special(){if(state!=='play'||focus<100||insight>0)return;focus=0;insight=6+(p.qExtra||0);fire=0;quote='쟁점 포착! '+(6+(p.qExtra||0))+'초간 제출 속도 1.6배 · 공격력 1.3배';quoteT=3;tone(1040,.25)}
update=function(dt){if(state!=='play')return;insight=Math.max(0,insight-dt);flash=Math.max(0,flash-dt);chainTime-=dt;if(chainTime<=0)chain=0;const before=shots.length,previousX=p.x,previousY=p.y;baseUpdate(dt);if(state!=='play')return;stillTime=Math.hypot(p.x-previousX,p.y-previousY)>20*dt?0:stillTime+dt;if(insight<=0)focus=Math.min(100,focus+dt*autoChargeRate());for(const b of bullets){let d=Math.hypot(b.x-p.x,b.y-p.y);if(!b.grazed&&d>b.r+5&&d<b.r+26&&p.inv<=0){b.grazed=true;grazeCount++;chain++;peakChain=Math.max(peakChain,chain);chainTime=2;score+=15+Math.min(chain,20)*2;if(insight<=0)focus=Math.min(100,focus+(p.focusBonus?20:12)*chargeMultiplier()*grazeChargeMultiplier());burst(b.x,b.y,'#afddce',3);if(chain%5===0)tone(500+chain*15)}}if(boss.hp<boss.max*.45&&!phaseSeen){phaseSeen=true;quote='심화 질문 시작! 공격 간격이 짧아집니다.';quoteT=2.5;flash=.12}extraClock-=dt;if(extraClock<=0&&hazards.length===0&&beams.length===0){if(attackStage()===1||[3,4].includes(attackStage())){let y=Math.max(285,Math.min(565,p.y-24));beams.push({y,w:48,wait:tuning().warning,life:.45})}if(attackStage()===2||(attackStage()===4&&attackCount%2===0)){let gap=Math.floor(Math.random()*8);for(let i=0;i<10;i++)if(Math.abs(i-gap)>1)bullet(55+i*103,210,Math.PI/2,140*mode,level===5?'증거':'심사',bosses[level].color)}extraClock=(phaseSeen?6:7.5)/mode}for(const b of beams){b.wait-=dt;if(b.wait<=0){b.life-=dt;if(p.y>b.y-5&&p.y<b.y+b.w+5)hit()}}beams=beams.filter(b=>b.life>0);};
draw=function(){baseDraw();if(!p)return;g.save();for(const b of beams){g.globalAlpha=b.wait>0?.16:.65;rect(0,b.y,W,b.w,'#ec997b');g.globalAlpha=1;txt(b.wait>0?'추가 질문 · 가로줄을 벗어나세요':'추가 질문!',W/2,b.y+30,15,'#ffe7b9','center')}rect(22,615,186,21,'#11291f');rect(24,617,182*(insight>0?insight/(6+(p.qExtra||0)):focus/100),17,insight>0||focus>=100?'#efd083':'#77bfa9');txt(insight>0?'Q 강화 중 '+insight.toFixed(1)+'초':focus>=100?'Q · 쟁점 포착 준비':'집중력 '+Math.floor(focus)+'%',115,630,12,'#fff8df','center');if(chain>1)txt('근접 회피 ×'+chain,24,600,16,'#f4d78a');if(p.shield){g.strokeStyle='#a6dafa';g.beginPath();g.arc(p.x,p.y,28,0,7);g.stroke()}if(keys.ShiftLeft||keys.ShiftRight){g.strokeStyle='#b6d6c0';g.beginPath();g.arc(p.x,p.y,9,0,7);g.stroke()}txt('근접 회피 '+grazeCount+'회',W-24,630,12,'#b8ccba','right');if(flash>0){g.globalAlpha=flash;rect(0,0,W,H,'#fff3c9')}g.restore();};

let playerName='',runId='',onlineRows=[],onlineStatus='',onlineFilter='1',fetchToken=0,pendingScore=null,submitBusy=false;

function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function onlineConfig(){const cfg=window.LAW_GAME_CONFIG||{};return {url:String(cfg.supabaseUrl||'').replace(/\/$/,''),key:String(cfg.supabasePublishableKey||'')}}
function onlineEnabled(){const cfg=onlineConfig();return /^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(cfg.url)&&/^sb_publishable_[A-Za-z0-9_-]+$/.test(cfg.key)}
async function apiRequest(path,options={}){const cfg=onlineConfig();const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),10000);try{const res=await fetch(cfg.url+'/rest/v1/'+path,{...options,signal:controller.signal,headers:{apikey:cfg.key,'Content-Type':'application/json',...options.headers}});if(!res.ok){if(res.status===409&&options.method==='POST')return null;throw Error('HTTP '+res.status)}return res.status===204||options.method==='POST'?null:await res.json()}finally{clearTimeout(timer)}}
start=function(){state='name';frontPage(true);show(`<div class="name-page"><div class="eyebrow">${difficultyName()} · 수강생 등록</div><h2>이름을 입력하세요.</h2><form id="name-form"><input id="player-name" aria-label="이용자 이름" maxlength="16" autocomplete="nickname" required value="${escapeHtml(playerName)}" placeholder="이름 또는 별명"><p>${onlineEnabled()?'이 이름과 게임 기록이 공개 명예의 전당에 등록됩니다.':'현재는 이 브라우저에 기록됩니다.'}</p><p id="name-error" role="alert"></p><button class="start" type="submit">수업 시작 →</button></form><button id="name-back">돌아가기</button></div>`);document.querySelector('#name-back').onclick=enrollment;document.querySelector('#name-form').onsubmit=e=>{e.preventDefault();const name=document.querySelector('#player-name').value.trim();if(!/^[\p{L}\p{N} _.-]{1,16}$/u.test(name)){document.querySelector('#name-error').textContent='이름은 1~16자, 문자·숫자·공백·_ . -로 입력해주세요.';fitPanel();return}playerName=name;try{localStorage.setItem('law-player-name',name)}catch(e){}runId=crypto.randomUUID();pendingScore=null;startRun()};}
async function loadOnlineHall(){if(!onlineEnabled())return;const token=++fetchToken;onlineStatus='기록 불러오는 중';renderMenu();try{const rows=await apiRequest('law_scores?select=player_name,score,gpa,course_grades,win,stage,difficulty,created_at&version=eq.six-1&difficulty=eq.'+onlineFilter+'&order=score.desc,created_at.asc&limit=100');if(token!==fetchToken)return;onlineRows=rows;onlineStatus='온라인 · 점수순 상위 100판';}catch(e){if(token!==fetchToken)return;onlineStatus='기록을 불러오지 못했습니다. 새로고침해 주세요.';onlineRows=[]}if(state==='menu')renderMenu()}
async function submitOnline(){if(!pendingScore||submitBusy)return;const payload=pendingScore,result=finalResult;submitBusy=true;result.upload='등록 중';if(state==='end')renderFinal();try{await apiRequest('law_scores',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(payload)});if(pendingScore===payload)pendingScore=null;result.upload='명예의 전당 등록 완료'}catch(e){result.upload='등록 실패 · 다시 시도할 수 있습니다.'}finally{submitBusy=false;if(state==='end'&&finalResult===result)renderFinal()}}

let courseGrades=Array(bosses.length).fill(null);
const gradePoints={"A+":4.3,"A0":4,"A-":3.7,"B+":3.3,"B0":3,"B-":2.7,"C+":2.3,"C0":2,"C-":1.7,"D+":1.3,"D0":1,"D-":.7,"F":0};
function calculateGpa(grades){const done=grades.filter(g=>Object.hasOwn(gradePoints,g));return done.length?done.reduce((n,g)=>n+gradePoints[g],0)/done.length:0}
function transcript(){return `<div class="transcript">${bosses.map((b,i)=>`<div><span>${b.name.replace(" 교수","")}</span><b>${courseGrades[i]||"미수강"}</b><span>${courseGrades[i]!==null?gradePoints[courseGrades[i]].toFixed(1):"—"}</span></div>`).join("")}</div>`}

try{const saved=JSON.parse(localStorage.getItem('law-arcade-hall-1.4')||'[]');if(Array.isArray(saved))hallRecords=saved.filter(r=>r&&Number.isFinite(r.score)&&['A+','A0','A-','B+','B0','B-','C+','C0','C-','D+','D0','D-','F','S','A','B','C','미이수'].includes(r.grade)&&typeof r.difficulty==='string').map(r=>({...r,grade:({S:'A+',A:'A0',B:'B0',C:'C0','미이수':'F'})[r.grade]||r.grade,difficulty:r.difficulty.replace(/[<>&"']/g,''),date:String(r.date||'').replace(/[<>&"']/g,'')}))}catch(e){}
function letterGrade(hits,passed=true){if(!passed)return 'F';return ['A+','A0','A-','B+','B0','B-','C+','C0','C-','D+','D0','D-'][Math.min(11,Math.max(0,Math.ceil(hits)))]}
function visibleHallRows(){return onlineEnabled()?onlineRows.map(r=>({name:r.player_name,score:r.score,gpa:Number(r.gpa),win:r.win,level:r.stage,date:new Date(r.created_at).toLocaleDateString('ko-KR')})):[...hallRecords].filter(r=>r.difficulty===({'1':'재학생','1.14':'시험 일주일 전','1.28':'시험 전날','1.42':'시험 당일'})[onlineFilter]).sort((a,b)=>b.score-a.score)}
function hallHtml(){const rows=visibleHallRows(),size=innerWidth<=650?3:5,total=Math.max(1,Math.ceil(rows.length/size)),modes=[[1,'재학생'],[1.14,'시험 일주일 전'],[1.28,'시험 전날'],[1.42,'시험 당일']];hallPage=Math.min(hallPage,total-1);return `<aside class="hall"><div class="hall-heading"><h3>명예의 전당</h3><span>HALL OF FAME</span></div><div class="hall-tabs" aria-label="랭킹 난이도">${modes.map(([v,n])=>`<button type="button" data-hall-mode="${v}" aria-pressed="${String(v)===onlineFilter}">${n}</button>`).join('')}</div><select id="hall-mode" aria-label="랭킹 난이도" tabindex="-1">${modes.map(([v,n])=>`<option value="${v}" ${String(v)===onlineFilter?'selected':''}>${n}</option>`).join('')}</select><div class="hall-status"><p class="hall-note" aria-live="polite">${escapeHtml(onlineEnabled()?onlineStatus:'이 브라우저 기록 · 점수순')}</p><button id="hall-refresh" aria-label="명예의 전당 새로고침">↻ 갱신</button></div><div class="hall-columns" aria-hidden="true"><span>순위</span><span>수강생 / 결과</span><span>점수 / 평점</span></div>${rows.length?rows.slice(hallPage*size,(hallPage+1)*size).map((r,i)=>{const rank=hallPage*size+i+1;return `<div class="hall-row ${rank<=3?'top-rank':''}"><span class="hall-rank">${String(rank).padStart(2,'0')}</span><div><strong>${escapeHtml(r.name||'이전 이용자')}</strong><small>${r.win?'종강 완료':r.level+'교시 종료'}${r.practice?' · 연습':''}</small><time>${escapeHtml(r.date)}</time></div><b class="hall-score">${Number(r.score).toLocaleString()}<span>${Number.isFinite(r.gpa)?'평점 '+r.gpa.toFixed(2)+' / 4.3':'이전 기록'}</span></b></div>`}).join(''):`<div class="hall-empty"><b>${onlineEnabled()&&/불러|로딩|조회 중/.test(onlineStatus)?'기록을 불러오는 중입니다.':onlineEnabled()&&/실패|오류/.test(onlineStatus)?'기록을 불러오지 못했어요.':'첫 번째 주인공을 기다립니다.'}</b>${onlineEnabled()&&/실패|오류/.test(onlineStatus)?'갱신 버튼을 눌러 다시 시도하세요.':'이 난이도에 도전하고 기록을 남겨보세요.'}</div>`}<nav class="page-nav" aria-label="순위 페이지"><button id="hall-prev" aria-label="이전 순위 페이지" ${hallPage===0?'disabled':''}>← 이전</button><span>${hallPage+1} / ${total}</span><button id="hall-next" aria-label="다음 순위 페이지" ${hallPage===total-1?'disabled':''}>다음 →</button></nav></aside>`}

function bindHall(render){document.querySelectorAll("[data-hall-mode]").forEach(button=>{button.onclick=()=>{const select=document.querySelector("#hall-mode");select.value=button.dataset.hallMode;select.dispatchEvent(new Event("change"))}});document.querySelector('#hall-prev').onclick=()=>{if(hallPage>0){hallPage--;render()}};document.querySelector('#hall-next').onclick=()=>{if((hallPage+1)*(innerWidth<=650?3:5)<visibleHallRows().length){hallPage++;render()}}}

function stageReport(){state='report';hallPage=0;renderStageReport()}
function renderStageReport(){const hits=damageTaken-stageHitsStart;show(`<div class="report-layout"><section class="report-main"><div class="eyebrow">${level+1}교시 · ${bosses[level].name}</div><h2>수업을 통과했습니다.</h2><div class="grade-big">${letterGrade(hits)}</div><p>이번 교시 피격 ${hits}회 · 현재 ${score.toLocaleString()}점<br>통과 보상 1,200점 반영</p><button class="start" id="open-shop">매점으로 →</button></section></div>`);document.querySelector('#open-shop').onclick=()=>{state='shop';renderShop()}}
let shopPage=0,helpPage=0;
function fitPanel(){if(overlay.classList.contains('hidden'))return;panel.style.setProperty('--panel-fit','1');const room=overlay.getBoundingClientRect();const scale=Math.min(1,(room.height-24)/Math.max(1,panel.scrollHeight),(room.width-20)/Math.max(1,panel.offsetWidth));panel.style.setProperty('--panel-fit',String(Math.max(.1,scale)))}
function shopPageSize(){return innerWidth<=650||innerHeight<=550?2:6}
function pager(current,total,type){return `<nav class="page-nav" aria-label="${type==='shop'?'상점':'도움말'} 페이지"><button id="page-prev" ${current===0?'disabled':''} aria-label="이전 페이지">← 이전</button><span>${current+1} / ${total}</span><button id="page-next" ${current===total-1?'disabled':''} aria-label="다음 페이지">다음 →</button></nav>`}
function bindPager(current,total,change){document.querySelector('#page-prev').onclick=()=>{if(current>0)change(current-1)};document.querySelector('#page-next').onclick=()=>{if(current<total-1)change(current+1)}}
addEventListener('resize',()=>{if(state==='menu')renderMenu();else if(state==='shop')renderShop();else if(state==='report')renderStageReport();else if(state==='end')renderFinal();else fitPanel()});
const shopIconPaths={'coffee': '<path d="M10 18h25v19a6 6 0 0 1-6 6H16a6 6 0 0 1-6-6z" fill="#be9270"/><path d="M35 21h4a7 7 0 0 1 0 14h-4M8 47h31M17 12V7m8 5V5m8 7V8"/>', 'energy': '<rect x="14" y="8" width="24" height="40" rx="5" fill="#83b9ac"/><path d="M17 14h18M17 42h18M29 19l-9 12h7l-3 9 10-14h-7z" fill="#efce7b"/>', 'book': '<path d="M12 9h27v36H15a5 5 0 0 1-5-5V14a5 5 0 0 1 5-5" fill="#bb8b69"/><path d="M15 9v30m-5 2h29M21 19h12m-12 7h12"/>', 'notes': '<rect x="12" y="10" width="28" height="35" rx="2" fill="#a6c7b0"/><path d="M18 7v7m9-7v7m9-7v7M18 22h15m-15 7h15m-15 7h9M34 39l10-15 4 3-10 15-5 3z" fill="#e7c785"/>', 'shoes': '<path d="M8 32l9-16 9 6 1 9 16 6 2 9H8z" fill="#8eaccb"/><path d="M8 40h34M21 26l7-3m-6 9 8-3"/>', 'sleep': '<path d="M33 8a19 19 0 1 0 12 28A18 18 0 0 1 33 8z" fill="#efd082"/><path d="M34 14h10l-10 10h10M12 39h12"/>', 'shield': '<path d="M26 7l17 7v13c0 10-10 17-17 21C19 44 9 37 9 27V14z" fill="#8eafcc"/><path d="M17 27l6 6 12-14"/>', 'cases': '<path d="M7 15h17l3 4 3-4h15v30H30l-3 3-3-3H7z" fill="#bc9cbd"/><path d="M27 19v29M12 23h9m-9 7h9m-9 7h9m12-14h8m-8 7h8m-8 7h8"/>', 'exam': '<rect x="11" y="9" width="30" height="38" rx="3" fill="#d1b16f"/><path d="M19 16h14M19 40h14M22 24a5 5 0 1 1 7 5c-3 1-3 3-3 4m0 3v1"/>', 'focus': '<path d="M7 10h24v30H7z" fill="#a2bea5"/><path d="M12 18h13m-13 7h10m-10 7h9"/><circle cx="34" cy="30" r="10" fill="#d6dca8"/><path d="M41 38l8 10M30 30h8m-4-4v8"/>', 'dodge': '<path d="M29 7L16 27h10l-4 20 18-26H29z" fill="#e2bb72"/><path d="M7 16h11M4 25h8M7 36h9m21 5h9"/>'};
function shopIcon(id){return `<svg class="item-icon" viewBox="0 0 54 54" aria-hidden="true" focusable="false" fill="none" stroke="#f0e4c4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">${shopIconPaths[id]}</svg>`}
const shopItems=[
{id:'coffee',name:'커피',desc:'멘탈 2 회복',cost:300,cap:1,ok:()=>p.hp<p.max,apply:()=>p.hp=Math.min(p.max,p.hp+2)},
{id:'energy',name:'에너지드링크',desc:'밤샘 정리 E 1 보충 · 최대 3',cost:300,cap:1,ok:()=>p.bombs<3,apply:()=>p.bombs++},
{id:'book',name:'기본서',desc:'답안 공격력 +25% · 최대 3권',cost:900,cap:3,apply:()=>p.damage*=1.25},
{id:'notes',name:'속기 노트',desc:'제출 속도 +18% · 최대 3권',cost:800,cap:3,apply:()=>p.rate=Math.max(.1,p.rate/1.18)},
{id:'shoes',name:'운동화',desc:'이동 속도 +10% · 최대 360',cost:500,cap:3,ok:()=>p.speed<360,apply:()=>p.speed=Math.min(360,p.speed*1.1)},
{id:'sleep',name:'수면 시간 확보',desc:'최대 멘탈 +1 · 멘탈 2 회복 · 최대 8',cost:900,cap:3,ok:()=>p.max<8,apply:()=>{p.max++;p.hp=Math.min(p.max,p.hp+2)}},
{id:'shield',name:'예비 답안',desc:'다음 피격 1회 방어 · 중첩 불가',cost:600,cap:1,ok:()=>!p.shield,apply:()=>p.shield=true},
{id:'cases',name:'판례집',desc:'첫 구매: 좌우 20% 보조 답안 / 두 번째: 각 30%',cost:1000,cap:2,apply:()=>{if(p.twin)p.sidePower=.3;else{p.twin=true;p.sidePower=.2}}},
{id:'exam',name:'예상문제집',desc:'Q 지속시간 +1초 · 최대 8초',cost:700,cap:2,apply:()=>p.qExtra=(p.qExtra||0)+1},
{id:'focus',name:'판례의 행간',desc:'근접 회피 집중력 획득 +67%',cost:650,cap:1,apply:()=>p.focusBonus=true},
{id:'dodge',name:'기민한 순발력',desc:'회피 재사용 대기시간 35% 감소',cost:900,cap:1,apply:()=>p.dashReduction=true}
];
function shopCount(item){return shopBought[item.id]||0}
function shopPrice(item){return item.cost+(['book','notes','cases'].includes(item.id)?shopCount(item)*200:0)}
function buyItem(id){if(state!=='shop')return;const item=shopItems.find(o=>o.id===id);if(!item||shopCount(item)>=item.cap||item.ok&&!item.ok()||score<shopPrice(item))return;const shopPriceBefore=shopPrice(item);score-=shopPriceBefore;item.apply();shopBought[id]=shopCount(item)+1;build.push(item.name);shopNotice=item.name+' 구매 완료 · '+shopPriceBefore.toLocaleString()+'점 차감';tone(720,.1);renderShop()}
function renderShop(){const pageSize=shopPageSize(),pages=Math.ceil(shopItems.length/pageSize);shopPage=Math.min(shopPage,pages-1);show(`<div class="shop-panel"><div class="eyebrow">${level+1}교시 종료 · 다음 수업 ${bosses[level+1].name}</div><h2>광복관 매점</h2><div class="shop-balance">현재 점수 ${score.toLocaleString()}점</div><div class="shop-status">멘탈 ${p.hp}/${p.max} · E ${p.bombs}/3 · 공격력 ${p.damage.toFixed(1)} · Q ${6+(p.qExtra||0)}초<br>쉬는 시간 멘탈 1 · E 1 보충 완료 / 교시 통과 +1,200점</div><div class="shop-grid">${shopItems.slice(shopPage*pageSize,(shopPage+1)*pageSize).map(item=>{const count=shopCount(item),sold=count>=item.cap,unavailable=item.ok&&!item.ok(),price=shopPrice(item);return `<div class="shop-card"><div class="item-heading">${shopIcon(item.id)}<b>${item.name}</b></div><p>${item.desc}</p><button data-buy="${item.id}" ${sold||unavailable||score<price?'disabled':''}>${sold?'구매 한도 도달':unavailable?'현재 보충 불필요':price.toLocaleString()+'점 · 구매'}</button></div>`}).join('')}</div>${pager(shopPage,pages,'shop')}<div class="shop-notice" role="status" aria-live="polite">${shopNotice||'구매 가격만큼 현재 점수와 최종 기록이 낮아집니다.'}</div><button class="start" id="next-class">${level+2}교시 입실 →</button><p>구매는 선택입니다. 아이템 효과는 이번 판에서만 유지됩니다.</p></div>`);bindPager(shopPage,pages,n=>{shopPage=n;shopNotice='';renderShop()});panel.querySelectorAll('[data-buy]').forEach(btn=>btn.onclick=()=>buyItem(btn.dataset.buy));document.querySelector('#next-class').onclick=()=>{if(state!=='shop')return;Object.keys(keys).forEach(k=>keys[k]=false);pointer=null;level++;next()}}
upgrade=function(){if(state==='shop'||state==='report')return;courseGrades[level]=letterGrade(damageTaken-stageHitsStart);state='shop';score+=1200;beams=[];p.hp=Math.min(p.max,p.hp+1);p.bombs=Math.min(3,p.bombs+1);shopBought.coffee=0;shopBought.energy=0;shopBought.shield=0;shopNotice='';shopPage=0;pointer=null;stageReport()};

let finalResult=null;
finish=function(win){if(state==='end')return;state='end';if(win)score+=p.hp*500+Math.max(0,Math.round(420-elapsed))*10;const k=recordKey();if(!attempts&&score>(record[k]?.score||0)){record[k]={score,win};try{localStorage.setItem('law-arcade-shop-1.5',JSON.stringify(record))}catch(e){}}const grade=letterGrade(damageTaken-stageHitsStart,win);courseGrades[level]=grade;const gpa=calculateGpa(courseGrades);finalResult={win,grade,gpa,stageGrade:grade};hallRecords.push({name:playerName,courseCount:bosses.length,grade,gpa,courseGrades:[...courseGrades],score,win,level:level+1,difficulty:difficultyName(),practice:attempts>0,date:new Date().toLocaleDateString('ko-KR')});try{localStorage.setItem('law-arcade-hall-1.4',JSON.stringify(hallRecords))}catch(e){}hallPage=0;renderFinal();if(onlineEnabled()&&!attempts){pendingScore={id:runId,player_name:playerName,score,course_grades:[...courseGrades],win,stage:level+1,difficulty:mode,version:'six-1'};submitOnline()}else if(attempts){finalResult.upload='연습 재도전 기록은 온라인 순위에서 제외됩니다.';renderFinal()}};
function renderFinal(){const {win,grade,gpa,stageGrade}=finalResult;show(`<div class="report-layout"><section class="report-main"><div class="eyebrow">${difficultyName()} · ${win?'전 과목 이수':'수강 종료'}</div><h2>${win?'교수님, 종강하겠습니다!':'다음 시간에 다시 봅시다.'}</h2><div class="grade-big gpa-big">${gpa.toFixed(2)}<small> / 4.3</small></div>${transcript()}<p class="help-note">${win?"전체 6과목 평균":"응시한 "+courseGrades.filter(g=>g!==null).length+"과목 평균 · F 포함 · 미수강 제외"}</p><h3>${escapeHtml(playerName)} · 최종 ${score.toLocaleString()}점</h3><p role="status">${finalResult.upload||""}</p>${pendingScore&&!submitBusy?'<button id="upload-retry">기록 등록 재시도</button>':''}<p>${level+1}교시 학점 ${stageGrade} · 총 피격 ${damageTaken}회 · ${Math.floor(elapsed)}초<br>근접 회피 ${grazeCount}회 · 최대 연속 ${peakChain}회</p><p>${attempts?'연습 기록 · 최고 기록에서 제외':'난이도별 최고 '+(record[recordKey()]?.score||0).toLocaleString()+'점'}</p><div class="report-controls">${!win?'<button id="continue">이 수업 재도전</button>':''}<button id="retry">처음부터</button><button id="home">수강 화면</button></div></section></div>`);if(pendingScore&&!submitBusy)document.querySelector('#upload-retry').onclick=submitOnline;document.querySelector('#retry').onclick=start;document.querySelector('#home').onclick=menu;if(!win)document.querySelector('#continue').onclick=()=>{attempts++;const cp=checkpoint;courseGrades=[...cp.courseGrades];p={...cp.p};score=cp.score;elapsed=cp.elapsed;focus=cp.focus;grazeCount=cp.grazeCount;damageTaken=cp.damageTaken;peakChain=cp.peakChain;next()};}

let pointer=null;c.addEventListener('pointerdown',e=>{if(state!=='play')return;c.setPointerCapture(e.pointerId);movePointer(e)});function movePointer(e){let r=c.getBoundingClientRect();pointer={x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}c.addEventListener('pointermove',e=>{if(c.hasPointerCapture(e.pointerId))movePointer(e)});c.addEventListener('pointerup',()=>pointer=null);c.addEventListener('pointercancel',()=>pointer=null);
addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();keys[e.code]=true;if(e.repeat)return;if(e.code==='Space')dodge();if(e.code==='KeyE')bomb();if(e.code==='KeyQ')special();if(e.code==='Escape'&&(state==='help'||state==='enrollment'))menu();else if(e.code==='KeyP'||e.code==='Escape')pause()});addEventListener('keyup',e=>keys[e.code]=false);addEventListener('blur',()=>{Object.keys(keys).forEach(k=>keys[k]=false);pointer=null;if(state==='play')pause()});document.querySelector('#pause').onclick=pause;document.querySelector('#dash').onclick=dodge;document.querySelector('#bomb').onclick=bomb;document.querySelector('#special').onclick=special;document.querySelector('#sound').onclick=()=>{sound=!sound;document.querySelector('#sound').textContent='소리 '+(sound?'ON':'OFF');tone()};function loop(now){let dt=Math.min(.033,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(loop)}menu();requestAnimationFrame(loop);
</script>
</body>
</html>
