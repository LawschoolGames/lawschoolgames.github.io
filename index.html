<style>
:root{color-scheme:dark;--bg:#101216;--surface:#191c22;--line:#30343e;--text:#f1f2f4;--muted:#a0a6b2;--accent:#a9bbff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;word-break:keep-all}a{color:inherit;text-decoration:none}button,input{font:inherit}button,a,input{-webkit-tap-highlight-color:transparent}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:5px}button{cursor:pointer}svg{display:block}header{height:80px;border-bottom:1px solid var(--line)}.header-inner{max-width:1280px;height:100%;margin:auto;padding:0 40px;display:flex;align-items:center;gap:50px}.brand{display:flex;gap:11px;align-items:center;font-size:19px;font-weight:800;letter-spacing:-.7px}.brand-icon{height:32px;width:32px;display:grid;place-items:center;background:var(--accent);color:#141927;border-radius:9px}.header-nav{height:100%;display:flex;align-items:center;border-bottom:3px solid var(--accent);font-size:14px;font-weight:600;padding:3px 3px 0}.header-note{margin-left:auto;font-size:12px;color:var(--muted)}main{max-width:1280px;margin:auto;padding:42px 40px 72px}.section-label{display:flex;gap:10px;align-items:center;font-size:13px;font-weight:700;margin:0 0 17px}.section-label:before{content:'';width:5px;height:14px;background:var(--accent);border-radius:2px}.feature{display:grid;grid-template-columns:1.15fr 1fr;border:1px solid #39414a;border-radius:18px;overflow:hidden;background:#1b2225;min-height:376px}.scene{position:relative;min-height:376px;background:#1c3730;overflow:hidden}.scene svg{width:100%;height:100%;position:absolute;inset:0;object-fit:cover}.scene-caption{position:absolute;top:22px;left:24px;font-size:10px;letter-spacing:2px;color:#c2d2c6;display:flex;gap:8px;align-items:center}.scene-caption:before{content:'';width:5px;height:5px;background:#c1d4b8;border-radius:50%}.feature-copy{padding:40px;display:flex;flex-direction:column;justify-content:center;background:#1a2224}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{font-size:11px;background:#ffffff0a;border:1px solid #ffffff1d;border-radius:5px;padding:5px 8px;color:#b8c5bf}.feature h1{font-size:clamp(27px,3.4vw,42px);line-height:1.3;letter-spacing:-1.8px;margin:20px 0 14px}.feature p{font-size:14px;color:#b2bdb8;line-height:1.85;margin:0;max-width:360px}.feature-meta{display:flex;gap:18px;font-size:12px;color:#92a79b;margin:22px 0 28px}.launch{display:inline-flex;align-items:center;justify-content:center;gap:32px;background:#deebd6;color:#19281d;border-radius:8px;font-size:14px;font-weight:800;padding:15px 23px;align-self:start;transition:background .18s,transform .18s}.launch:hover{background:#f0fae9;transform:translateY(-2px)}.library-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:44px 0 20px}.library-title{display:flex;align-items:center;gap:11px}.library-title h2{font-size:21px;letter-spacing:-.7px;margin:0}.total{font-size:12px;color:var(--muted)}.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 14px;color:var(--muted)}.search input{width:195px;background:none;border:0;color:var(--text);font-size:13px;min-width:0}.search input:focus{outline:none}.search:focus-within{border-color:var(--accent)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:23px}.filters button{border:1px solid var(--line);border-radius:6px;padding:8px 15px;font-size:12px;background:transparent;color:var(--muted)}.filters button[aria-pressed=true]{color:#e8ecff;background:#293044;border-color:#485575}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}.card{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);transition:transform .18s,border-color .18s;display:flex;flex-direction:column}.card:hover{transform:translateY(-4px);border-color:#6c788e}.thumb{position:relative;aspect-ratio:1.85;background:#244137;overflow:hidden}.thumb svg{width:100%;height:100%;position:absolute;inset:0}.thumb-badge{position:absolute;bottom:13px;left:14px;font-size:10px;padding:5px 7px;border-radius:4px;background:#0c1618d9;color:#dbe8df}.card-body{padding:19px 20px 17px}.card h3{font-size:17px;letter-spacing:-.7px;margin:0 0 9px}.card p{font-size:12px;color:var(--muted);line-height:1.75;margin:0 0 18px}.card-bottom{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:13px;font-size:11px;color:var(--muted)}.card-bottom b{color:#d9e1fc;font-size:12px}.empty{padding:50px 20px;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-align:center;color:var(--muted);font-size:14px}.empty button{display:block;margin:20px auto 0;border:1px solid var(--line);background:none;color:var(--text);padding:10px 18px;border-radius:6px}.foot{max-width:1200px;margin:auto;border-top:1px solid var(--line);padding:24px 0 30px;display:flex;justify-content:space-between;gap:18px;color:#797f8c;font-size:11px;line-height:1.8}.foot strong{font-weight:600;color:#a7acb5}[hidden]{display:none!important}@media(min-width:1500px){main{padding-top:52px}.feature{min-height:414px}.scene{min-height:414px}}@media(max-width:900px){.header-inner{padding:0 25px;gap:30px}main{padding:30px 25px 50px}.feature-copy{padding:28px}.feature-meta{gap:10px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.foot{margin:0 25px}.scene{min-height:350px}.feature{min-height:350px}}@media(max-width:620px){header{height:65px}.header-inner{padding:0 20px;gap:26px}.brand{font-size:17px}.header-nav{font-size:12px}.header-note{display:none}main{padding:27px 18px 44px}.section-label{font-size:12px}.feature{grid-template-columns:1fr;border-radius:13px}.scene{min-height:0;height:225px}.scene-caption{top:17px;left:18px;font-size:9px}.feature-copy{padding:25px}.feature h1{font-size:30px;margin:14px 0 10px}.feature p{font-size:13px}.feature-meta{margin:17px 0 22px}.launch{width:100%;justify-content:space-between}.library-head{margin-top:32px;flex-wrap:wrap;gap:17px}.library-title h2{font-size:20px}.search{width:100%}.search input{width:100%}.grid{grid-template-columns:1fr}.thumb{aspect-ratio:2.05}.foot{margin:0 18px;flex-direction:column;gap:7px}.card-body{padding:19px}.filters{margin-bottom:18px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<header><div class="header-inner"><a class="brand" href="./" aria-label="로스쿨 오락실 홈"><span class="brand-icon" aria-hidden="true"><svg width="23" height="23" viewBox="0 0 24 24" fill="none"><path d="M7 7h10c2 0 3 2 3.5 4l1 6c.4 2-2 3-3.3 1.5L16 16H8l-2.2 2.5C4.5 20 2.1 19 2.5 17l1-6C4 9 5 7 7 7Z" stroke="currentColor" stroke-width="1.8"/><path d="M8 10v5m-2.5-2.5h5" stroke="currentColor" stroke-width="1.8"/><circle cx="16" cy="11" r="1" fill="currentColor"/><circle cx="18" cy="14" r="1" fill="currentColor"/></svg></span>로스쿨 오락실</a><a class="header-nav" href="#library">게임 둘러보기</a><span class="header-note">로스쿨생을 위한 웹게임</span></div></header>
<main>
<p class="section-label">지금 플레이</p>
<section class="feature" aria-labelledby="feature-title"><div class="scene" id="feature-art" aria-hidden="true"><span class="scene-caption">교수님, 종강하겠습니다</span></div><div class="feature-copy"><div class="chips"><span class="chip">탄막 슈팅</span><span class="chip">온라인 랭킹</span></div><h1 id="feature-title">교수님,<br>종강하겠습니다.</h1><p>공격은 피하고, 답안은 제출하고.<br>마지막 수업까지 살아남아 종강을 쟁취하세요.</p><div class="feature-meta"><span>PC · 모바일</span><span>4가지 난이도</span><span>1인 플레이</span></div><a class="launch" href="./Arcade/">게임 시작하기 <span aria-hidden="true">↗</span></a></div></section>
<section id="library" aria-labelledby="library-title"><div class="library-head"><div class="library-title"><h2 id="library-title">전체 게임</h2><span class="total" id="total">1개</span></div><label class="search"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.5"/><path d="m12 12 5 5" stroke="currentColor" stroke-width="1.5"/></svg><input id="search" type="search" placeholder="게임 이름으로 검색" aria-label="게임 검색"></label></div><div class="filters" id="filters" aria-label="게임 장르"></div><div class="grid" id="games"></div><div class="empty" id="empty" hidden>조건에 맞는 게임이 없습니다.<button id="reset" type="button">전체 게임 보기</button></div></section>
</main>
<footer class="foot"><strong>로스쿨 오락실</strong><span>실존 인물 및 학교의 공식 서비스와 무관한 창작 게임 모음입니다.</span></footer>
<script>
// 새 게임은 아래 목록에 추가하면 됩니다. 다른 설정 파일은 필요하지 않습니다.
const games=[{title:'교수님, 종강하겠습니다',genre:'탄막 슈팅',description:'교수님의 공격을 피하고, 난이도별 명예의 전당에 이름을 남겨보세요.',url:'./Arcade/',platform:'PC · 모바일',art:'classroom'}];
const scene=`<svg viewBox="0 0 600 410" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice"><rect width="600" height="410" fill="#1c3730"/><path d="M0 360H600M0 365H600" stroke="#987b4e" stroke-width="5"/><rect x="81" y="73" width="438" height="217" rx="3" fill="#234237" stroke="#63816b" stroke-width="2"/><path d="M95 87h410M95 278h410" stroke="#9fb89b" stroke-opacity=".13"/><text x="111" y="128" font-family="sans-serif" font-size="13" fill="#a9bda6" letter-spacing="2">FINAL LECTURE</text><text x="110" y="179" font-family="Malgun Gothic,sans-serif" font-size="33" font-weight="700" fill="#e6e5c9">이것도 시험에 나옵니다.</text><path d="M112 197h318" stroke="#d4d6b4" stroke-width="2" opacity=".65"/><text x="112" y="241" font-family="Malgun Gothic,sans-serif" font-size="13" fill="#b1c4ac">민법 · 헌법 · 형법 · 민사소송법 · 형사소송법</text><g fill="#e1c974"><circle cx="262" cy="319" r="5"/><circle cx="217" cy="336" r="5"/><circle cx="308" cy="336" r="5"/><circle cx="172" cy="352" r="5"/><circle cx="355" cy="352" r="5"/></g><g transform="translate(432 262)"><rect x="-27" y="16" width="54" height="58" rx="5" fill="#182526"/><rect x="-20" y="-24" width="40" height="45" rx="10" fill="#d0b795"/><path d="M-22-6v-14q0-22 26-17l19 10v24l-13-14h-26Z" fill="#233136"/><path d="M-17-6h13v10h-13zm22 0h13v10H5Z" fill="none" stroke="#25302c" stroke-width="3"/><path d="M-4-3h9" stroke="#25302c" stroke-width="3"/><path d="M-3 22v39M-10 26l7-4 7 4-7 10Z" stroke="#a5b9a4" stroke-width="3"/><path d="m-26 35-37-18" stroke="#d0b795" stroke-width="10"/><path d="m-62 16-26-30" stroke="#c9cba3" stroke-width="3"/></g><g transform="translate(102 306) rotate(-20)"><rect width="43" height="61" rx="2" fill="#efe9ce"/><path d="M8 12h27M8 20h20M8 28h25M8 36h18" stroke="#748777" stroke-width="2"/><text x="18" y="53" font-size="12" font-family="sans-serif" fill="#a85243">A+</text></g><path d="m271 396 13-24 13 24-13-5Z" fill="#b9d9d5"/><circle cx="284" cy="388" r="3" fill="#f2f5dc"/></svg>`;
document.querySelector('#feature-art').insertAdjacentHTML('afterbegin',scene);
let selected='전체';const filter=document.querySelector('#filters'),grid=document.querySelector('#games'),search=document.querySelector('#search');
function makeFilters(){filter.replaceChildren();for(const genre of ['전체',...new Set(games.map(g=>g.genre))]){const b=document.createElement('button');b.type='button';b.textContent=genre;b.setAttribute('aria-pressed',String(genre===selected));b.onclick=()=>{selected=genre;makeFilters();render()};filter.append(b)}}
function render(){const q=search.value.trim().toLowerCase();const list=games.filter(g=>(selected==='전체'||g.genre===selected)&&[g.title,g.description,g.genre].join(' ').toLowerCase().includes(q));grid.replaceChildren();for(const g of list){const a=document.createElement('a');a.className='card';a.href=g.url;const thumb=document.createElement('div');thumb.className='thumb';thumb.setAttribute('aria-hidden','true');if(g.art==='classroom')thumb.innerHTML=scene;const badge=document.createElement('span');badge.className='thumb-badge';badge.textContent=g.genre;thumb.append(badge);const body=document.createElement('div');body.className='card-body';const title=document.createElement('h3');title.textContent=g.title;const desc=document.createElement('p');desc.textContent=g.description;const bottom=document.createElement('div');bottom.className='card-bottom';const platform=document.createElement('span');platform.textContent=g.platform||'웹게임';const play=document.createElement('b');play.textContent='플레이 ↗';bottom.append(platform,play);body.append(title,desc,bottom);a.append(thumb,body);grid.append(a)}document.querySelector('#total').textContent=list.length+'개';document.querySelector('#empty').hidden=list.length>0}
search.addEventListener('input',render);document.querySelector('#reset').onclick=()=>{search.value='';selected='전체';makeFilters();render()};makeFilters();render();
</script>
</body>
</html>
