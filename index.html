<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="google-adsense-account" content="ca-pub-2988281090144525">
<meta name="description" content="수업과 수업 사이, 잠깐의 딴짓. 로스쿨생을 위한 웹게임 모음, 로스쿨 오락실.">
<title>로스쿨 오락실</title>
<style>
:root{--paper:#f4f2eb;--ink:#172c42;--muted:#67717b;--line:#c9cdc9;--yellow:#edc95e}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Pretendard,'Malgun Gothic',sans-serif}a{color:inherit}button,input{font:inherit}header{border-bottom:2px solid var(--ink)}.bar{max-width:1200px;margin:auto;min-height:84px;padding:20px 32px;display:flex;align-items:center;justify-content:space-between}.brand{text-decoration:none;font-size:23px;font-weight:900;letter-spacing:-1px}.brand span{display:inline-block;background:var(--ink);color:var(--paper);padding:5px 9px;margin-right:9px;font-size:17px;letter-spacing:0}.edition{font-size:11px;letter-spacing:2px}main{max-width:1200px;margin:auto;padding:64px 32px 90px}.intro{display:flex;justify-content:space-between;align-items:end;gap:24px;padding-bottom:47px;border-bottom:2px solid var(--ink)}.eyebrow{font-size:12px;letter-spacing:2px;font-weight:700;margin:0 0 20px}h1{font-size:clamp(38px,6vw,68px);line-height:1.18;letter-spacing:-3px;margin:0;font-weight:900}.intro p.desc{font-size:16px;color:var(--muted);line-height:1.9;margin:22px 0 0}.stamp{width:116px;height:116px;border:2px solid var(--ink);border-radius:50%;display:grid;place-content:center;text-align:center;transform:rotate(10deg);flex-shrink:0;background:var(--yellow);font-size:12px;line-height:1.9}.stamp b{font-size:25px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin:32px 0 25px}.toolbar h2{font-size:20px;margin:0;letter-spacing:-.7px}.count{font-size:12px;color:var(--muted);margin-left:10px}input{width:230px;background:transparent;border:0;border-bottom:2px solid var(--ink);padding:10px 2px;border-radius:0;outline-offset:4px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}.card{text-decoration:none;display:block;border:1px solid var(--line);background:#fffdf7;transition:transform .18s,box-shadow .18s}.card:hover{transform:translateY(-4px);box-shadow:0 8px 0 #172c4212}.card:focus-visible{outline:3px solid #315d91;outline-offset:5px}.art{aspect-ratio:1.45;position:relative;overflow:hidden;background:#203d32;color:#eee8d4;border-bottom:6px solid #7b5940;padding:23px}.art .top{font-size:10px;letter-spacing:3px;opacity:.65}.chalk{font-size:26px;font-weight:800;line-height:1.4;transform:rotate(-4deg);margin-top:25px;letter-spacing:-1px}.chalk small{font-size:12px;display:block;font-weight:400;letter-spacing:2px;margin-top:13px}.paper{position:absolute;right:32px;bottom:24px;width:45px;height:59px;background:#e9e2c4;transform:rotate(22deg);border:3px solid #d3c69d;box-shadow:-13px -10px 0 #e9e2c444}.paper:after{content:'';position:absolute;inset:12px 7px;background:repeating-linear-gradient(transparent 0 6px,#7b8775 6px 8px)}.details{padding:22px}.tags{font-size:11px;letter-spacing:1px;color:var(--muted);margin-bottom:12px}.details h3{margin:0;font-size:21px;letter-spacing:-1px}.details p{font-size:13px;line-height:1.8;color:var(--muted);margin:13px 0 24px}.play{border-top:1px solid var(--line);padding-top:15px;display:flex;justify-content:space-between;font-size:13px;font-weight:700}.more{margin:44px 0 0;padding-top:23px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}.empty{color:var(--muted);padding:35px 0}footer{border-top:2px solid var(--ink);max-width:1136px;margin:auto;padding:23px 0 35px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:15px;line-height:1.8}[hidden]{display:none!important}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}footer{margin:0 32px}}@media(max-width:560px){.bar{padding:19px 20px}.brand{font-size:20px}.edition{display:none}main{padding:40px 20px 65px}.intro{padding-bottom:32px}.stamp{display:none}h1{letter-spacing:-2px}.intro p.desc{font-size:14px}.toolbar{align-items:start;flex-direction:column;gap:12px}input{width:100%}.grid{grid-template-columns:1fr}.art{aspect-ratio:1.7}.chalk{font-size:30px}footer{margin:0 20px;flex-direction:column}}
</style>
</head>
<body>
<header><div class="bar"><a class="brand" href="./"><span>法</span>로스쿨 오락실</a><span class="edition">LAW SCHOOL ARCADE</span></div></header>
<main>
<section class="intro"><div><p class="eyebrow">수업과 수업 사이</p><h1>잠깐의 딴짓도<br>법대로.</h1><p class="desc">책은 잠시 덮고, 게임 한 판.<br>로스쿨생을 위한 작은 오락실입니다.</p></div><div class="stamp">예습은 잠시<b>PAUSE</b>쉬는 시간 영업 중</div></section>
<section aria-labelledby="games-heading"><div class="toolbar"><h2 id="games-heading">전체 게임<span class="count" id="count">01</span></h2><input id="search" type="search" placeholder="게임 찾기" aria-label="게임 검색"></div>
<div class="grid" id="games"></div><p class="empty" id="empty" hidden>검색한 게임이 없어요.</p><p class="more">다음 쉬는 시간에 즐길 게임도 차근차근 추가됩니다.</p></section>
</main><footer><span>로스쿨 오락실 · LAW SCHOOL ARCADE</span><span>실존 인물 및 학교의 공식 서비스와 무관한 창작 게임 모음입니다.</span></footer>
<script src="games.js"></script>
<script>
const grid=document.querySelector('#games'),search=document.querySelector('#search');
function render(){const query=search.value.trim().toLowerCase();const games=window.LAW_ARCADE_GAMES.filter(g=>[g.title,g.genre,g.description].join(' ').toLowerCase().includes(query));grid.replaceChildren();for(const g of games){const card=document.createElement('a');card.className='card';card.href=g.url;const art=document.createElement('div');art.className='art';art.setAttribute('aria-hidden','true');const top=document.createElement('div');top.className='top';top.textContent='LAW SCHOOL ARCADE';const chalk=document.createElement('div');chalk.className='chalk';chalk.textContent=g.title;const paper=document.createElement('div');paper.className='paper';art.append(top,chalk,paper);const details=document.createElement('div');details.className='details';const tags=document.createElement('div');tags.className='tags';tags.textContent=g.genre;const title=document.createElement('h3');title.textContent=g.title;const desc=document.createElement('p');desc.textContent=g.description;const play=document.createElement('div');play.className='play';play.innerHTML='<span>게임 시작</span><span aria-hidden="true">↗</span>';details.append(tags,title,desc,play);card.append(art,details);grid.append(card)}document.querySelector('#count').textContent=String(games.length).padStart(2,'0');document.querySelector('#empty').hidden=games.length>0}search.addEventListener('input',render);render();
</script></body></html>
